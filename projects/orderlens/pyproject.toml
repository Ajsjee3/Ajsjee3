[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderlens-portfolio"
version = "0.2.0"
description = "Order data quality, analytics APIs, and a retrieval baseline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "SQLAlchemy==2.0.52", "uvicorn==0.52.4", "psycopg[binary]==3.3.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.6"]

[tool.setuptools.packages.find]
include = ["orderlens*"]

[tool.setuptools.package-data]
"orderlens.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
