services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: orderlens
      POSTGRES_USER: orderlens
      POSTGRES_PASSWORD: ${ORDERLENS_DB_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - orderlens_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderlens -d orderlens"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ORDERLENS_DATABASE_URL: postgresql+psycopg://orderlens:${ORDERLENS_DB_PASSWORD}@db:5432/orderlens
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ORDERLENS_API_KEY: ${ORDERLENS_API_KEY:?Copy .env.example to .env first}
      ORDERLENS_DATABASE_URL: postgresql+psycopg://orderlens:${ORDERLENS_DB_PASSWORD}@db:5432/orderlens
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  orderlens_postgres:
